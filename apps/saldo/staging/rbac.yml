apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-saldo-hook
  namespace: staging-saldo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: staging-saldo-hook

rules:
  - apiGroups:
      -
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      -
    resources:
      - persistentvolumeclaims
      - persistentvolumes
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - patch
      - watch

  - apiGroups:
      - longhorn.io
    resources:
      - backups
      - volumes
      - backupvolumes
    verbs:
      - get
      - list
      - create
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: staging-saldo-hook

subjects:
  - kind: ServiceAccount
    name: staging-saldo-hook
    namespace: staging-saldo
roleRef:
  kind: ClusterRole
  name: staging-saldo-hook
  apiGroup: rbac.authorization.k8s.io

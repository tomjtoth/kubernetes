apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-saldo-hook
  namespace: staging-saldo
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: -1

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: staging-saldo-hook
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: -1

rules:
  - apiGroups:
      -
    resources:
      - persistentvolumeclaims
      - persistentvolumes
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - patch
      - watch

  - apiGroups:
      - longhorn.io
    resources:
      - backups
      - volumes
      - backupvolumes
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: staging-saldo-hook
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: -1

subjects:
  - kind: ServiceAccount
    name: staging-saldo-hook
    namespace: staging-saldo
roleRef:
  kind: ClusterRole
  name: staging-saldo-hook
  apiGroup: rbac.authorization.k8s.io

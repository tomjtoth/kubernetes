apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-saldo
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: -1
spec:
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      namespace: staging-saldo
      jsonPointers:
        - /spec/volumeName

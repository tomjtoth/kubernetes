apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-saldo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/tomjtoth/kubernetes
    targetRevision: HEAD
    path: apps/saldo/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: staging-saldo

  # using a 1MiB dummy as placeholder for the 0|1 suffixed pvc to work
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
        - /spec/resources/requests/storage

    - group: "apps"
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/volumes/0/persistentVolumeClaim/claimName

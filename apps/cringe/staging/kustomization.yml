apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging-cringe
resources:
  - ../base
  - rbac.yml
  - argocd-hook.yml

patches:
  - path: deployment.yml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: cringe-dep

  - path: deployment-db.yml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: cringe-db-dep

  - path: ingress.yml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: cringe-ing

  - path: ingress-ws.yml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: cringe-ws-ing

  - path: pvc.yml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: cringe-db-pvc
images:
  - name: IMAGES/APP
    newName: tomjtoth/cringe:latest

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-cringe
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/tomjtoth/kubernetes
    targetRevision: HEAD
    path: apps/cringe/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: staging-cringe

  syncPolicy:
    automated:
      enabled: true
      selfHeal: true

    syncOptions:
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: "apps"
      kind: Deployment
      name: cringe-db-dep
      namespace: staging-cringe
      jsonPointers:
        - /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
